  <!-- PREMIUM SPLASH CSS -->

  <style>

    /* Prevent white flash before React loads */
    html,
    body {
      margin: 0;
      padding: 0;
      background: #030305;
    }

    /* =========================
       SPLASH SCREEN
    ========================= */

    #lucky-splash {
      position: fixed;
      inset: 0;
      z-index: 999999;

      display: flex;
      align-items: center;
      justify-content: center;

      overflow: hidden;

      background:
        radial-gradient(
          circle at 50% 45%,
          rgba(35, 75, 130, 0.12),
          transparent 35%
        ),
        #030305;

      transition:
        opacity 0.8s ease,
        visibility 0.8s ease,
        transform 0.8s ease;
    }

    /* Fade out */
    #lucky-splash.hide {
      opacity: 0;
      visibility: hidden;
      transform: scale(1.03);
      pointer-events: none;
    }

    /* =========================
       BACKGROUND GLOW
    ========================= */

    .splash-glow-pink {
      position: absolute;

      width: 450px;
      height: 450px;

      left: -180px;
      top: -180px;

      border-radius: 50%;

      background: rgba(236, 30, 130, 0.16);

      filter: blur(120px);

      animation: pinkGlow 4s ease-in-out infinite alternate;
    }

    .splash-glow-blue {
      position: absolute;

      width: 500px;
      height: 500px;

      right: -220px;
      bottom: -220px;

      border-radius: 50%;

      background: rgba(0, 174, 255, 0.16);

      filter: blur(130px);

      animation: blueGlow 4s ease-in-out infinite alternate;
    }

    @keyframes pinkGlow {
      from {
        opacity: 0.5;
        transform: scale(0.9);
      }

      to {
        opacity: 1;
        transform: scale(1.15);
      }
    }

    @keyframes blueGlow {
      from {
        opacity: 0.5;
        transform: scale(0.9);
      }

      to {
        opacity: 1;
        transform: scale(1.15);
      }
    }

    /* =========================
       LIGHT STREAKS
    ========================= */

    .splash-light-top {
      position: absolute;

      width: 400px;
      height: 2px;

      top: 0;
      left: -100px;

      transform: rotate(-32deg);

      background: linear-gradient(
        90deg,
        transparent,
        #ff1493,
        transparent
      );

      filter: blur(1px);

      opacity: 0.8;

      animation: lightMove 3s ease-in-out infinite;
    }

    .splash-light-bottom {
      position: absolute;

      width: 450px;
      height: 2px;

      right: -120px;
      bottom: 50px;

      transform: rotate(-32deg);

      background: linear-gradient(
        90deg,
        transparent,
        #00c6ff,
        transparent
      );

      filter: blur(1px);

      opacity: 0.8;

      animation: lightMove 3.5s ease-in-out infinite reverse;
    }

    @keyframes lightMove {
      0% {
        opacity: 0.2;
        transform: translateX(-80px) rotate(-32deg);
      }

      50% {
        opacity: 1;
      }

      100% {
        opacity: 0.2;
        transform: translateX(80px) rotate(-32deg);
      }
    }

    /* =========================
       CONTENT
    ========================= */

    .splash-content {
      position: relative;
      z-index: 5;

      display: flex;
      flex-direction: column;

      align-items: center;

      text-align: center;

      padding: 30px;
    }

    /* =========================
       LOGO
    ========================= */

    .splash-logo-wrapper {
      position: relative;

      width: 205px;
      height: 205px;

      display: flex;
      align-items: center;
      justify-content: center;

      animation: logoAppear 1.2s cubic-bezier(
        0.16,
        1,
        0.3,
        1
      ) forwards;

      opacity: 0;

      transform: scale(0.65);
    }

    @keyframes logoAppear {
      0% {
        opacity: 0;
        transform: scale(0.65);
      }

      60% {
        opacity: 1;
      }

      100% {
        opacity: 1;
        transform: scale(1);
      }
    }

    /* Outer glowing ring */

    .splash-ring {
      position: absolute;

      inset: -12px;

      border-radius: 50%;

      background: conic-gradient(
        from 0deg,
        #ff1493,
        #8b5cf6,
        #00c6ff,
        #ff1493
      );

      animation: rotateRing 5s linear infinite;

      opacity: 0.9;

      filter:
        drop-shadow(0 0 8px rgba(255, 20, 147, 0.7))
        drop-shadow(0 0 15px rgba(0, 198, 255, 0.5));
    }

    .splash-ring::after {
      content: "";

      position: absolute;

      inset: 3px;

      border-radius: 50%;

      background: #030305;
    }

    @keyframes rotateRing {
      to {
        transform: rotate(360deg);
      }
    }

    /* Second ring */

    .splash-ring-two {
      position: absolute;

      inset: -22px;

      border-radius: 50%;

      border: 1px solid rgba(255, 255, 255, 0.12);

      animation:
        ringPulse 2.5s ease-in-out infinite alternate;
    }

    @keyframes ringPulse {
      from {
        opacity: 0.3;
        transform: scale(0.98);
      }

      to {
        opacity: 0.8;
        transform: scale(1.03);
      }
    }

    /* Logo itself */

    .splash-logo {
      position: relative;

      z-index: 4;

      width: 190px;
      height: 190px;

      object-fit: contain;

      border-radius: 50%;

      background: #000;

      box-shadow:
        0 0 20px rgba(255, 20, 147, 0.25),
        0 0 45px rgba(0, 198, 255, 0.2);

      animation: logoFloat 3s ease-in-out infinite;
    }

    @keyframes logoFloat {
      0%,
      100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-5px);
      }
    }

    /* =========================
       BRAND NAME
    ========================= */

    .splash-title {
      margin-top: 48px;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      font-size: clamp(
        38px,
        8vw,
        68px
      );

      line-height: 1;

      font-weight: 900;

      letter-spacing: 0.12em;

      text-transform: uppercase;

      color: white;

      opacity: 0;

      transform: translateY(30px);

      animation:
        titleAppear 1s
        cubic-bezier(
          0.16,
          1,
          0.3,
          1
        )
        0.45s
        forwards;
    }

    .splash-title span {
      background:
        linear-gradient(
          90deg,
          #00c6ff,
          #5b8cff,
          #ff1493
        );

      -webkit-background-clip: text;
      background-clip: text;

      color: transparent;
    }

    @keyframes titleAppear {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* =========================
       TAGLINE
    ========================= */

    .splash-tagline {
      display: flex;

      align-items: center;

      justify-content: center;

      gap: 14px;

      margin-top: 20px;

      opacity: 0;

      transform: translateY(15px);

      animation:
        taglineAppear 0.8s
        ease
        0.9s
        forwards;
    }

    .splash-tagline-line {
      width: 45px;
      height: 1px;

      background:
        linear-gradient(
          90deg,
          transparent,
          #ff1493
        );
    }

    .splash-tagline-line.right {
      background:
        linear-gradient(
          90deg,
          #00c6ff,
          transparent
        );
    }

    .splash-tagline-text {
      font-family:
        Arial,
        Helvetica,
        sans-serif;

      font-size: 12px;

      font-weight: 500;

      letter-spacing: 0.32em;

      text-transform: uppercase;

      color: rgba(
        255,
        255,
        255,
        0.7
      );
    }

    @keyframes taglineAppear {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* =========================
       LOADING BAR
    ========================= */

    .splash-loader {
      width: 190px;

      height: 2px;

      margin-top: 38px;

      overflow: hidden;

      border-radius: 10px;

      background: rgba(
        255,
        255,
        255,
        0.1
      );

      opacity: 0;

      animation:
        loaderAppear 0.5s
        ease
        1.15s
        forwards;
    }

    .splash-loader-bar {
      width: 100%;
      height: 100%;

      transform:
        translateX(-100%);

      background:
        linear-gradient(
          90deg,
          #ff1493,
          #8b5cf6,
          #00c6ff
        );

      animation:
        loading 1.3s
        ease-in-out
        1.25s
        forwards;
    }

    @keyframes loaderAppear {
      to {
        opacity: 1;
      }
    }

    @keyframes loading {
      to {
        transform:
          translateX(0);
      }
    }

    /* =========================
       WELCOME
    ========================= */

    .splash-welcome {
      margin-top: 12px;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      font-size: 9px;

      letter-spacing: 0.4em;

      text-transform: uppercase;

      color: rgba(
        255,
        255,
        255,
        0.35
      );

      opacity: 0;

      animation:
        welcomeAppear 0.5s
        ease
        1.3s
        forwards;
    }

    @keyframes welcomeAppear {
      to {
        opacity: 1;
      }
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 600px) {

      .splash-logo-wrapper {
        width: 170px;
        height: 170px;
      }

      .splash-logo {
        width: 158px;
        height: 158px;
      }

      .splash-title {
        margin-top: 40px;
        font-size: 38px;
        letter-spacing: 0.08em;
      }

      .splash-tagline-text {
        font-size: 9px;
        letter-spacing: 0.2em;
      }

      .splash-tagline-line {
        width: 25px;
      }

      .splash-loader {
        width: 160px;
      }
    }

  </style>

  <div id="root"></div>


  <!-- ========================= -->
  <!-- SPLASH CONTROL -->
  <!-- ========================= -->

  <script>

    (function () {

      function hideSplash() {

        var splash =
          document.getElementById(
            "lucky-splash"
          );

        if (!splash) return;

        /*
         * Give React a moment to render
         * before revealing the website.
         */

        setTimeout(function () {

          splash.classList.add("hide");

          /*
           * Completely remove it after
           * the fade animation.
           */

          setTimeout(function () {

            if (splash.parentNode) {
              splash.parentNode.removeChild(
                splash
              );
            }

          }, 900);

        }, 2300);

      }


      /*
       * Start after page resources
       * are ready.
       */

      if (
        document.readyState ===
        "complete"
      ) {

        hideSplash();

      } else {

        window.addEventListener(
          "load",
          hideSplash
        );

      }

    })();

  </script>
